name: mi_salud_pro
description: Mi Salud Pro MVP 1.0 - Aplicacion de entrenamiento, nutricion, habitos y seguimiento corporal.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8
  geolocator: ^13.0.1
  google_maps_flutter: ^2.9.0
  connectivity_plus: ^6.1.4
  image_picker: ^1.1.2
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/images/
    - assets/dist/
    - assets/dist/assets/
